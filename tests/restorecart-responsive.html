<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>RestoreCart responsive verification</title><meta name="viewport" content="width=device-width, initial-scale=1"><style>body{font:14px system-ui;background:#e9e8df;color:#263c35;padding:20px;margin:0}header{display:flex;gap:15px;align-items:center;margin-bottom:15px}button{padding:9px 15px;border:1px solid #bec8b4;border-radius:20px;background:#fff;color:#263c35;cursor:pointer}iframe{display:block;width:390px;height:844px;border:1px solid #bec8b4;border-radius:15px;background:#fff}p{max-width:650px}</style></head><body><header><strong>390 × 844 CSS-pixel verification</strong><button id="shop">Buyer shop</button><button id="seller">Seller workspace</button></header><p>Development test harness. The iframe has a real 390-pixel layout viewport; this is not mobile hardware emulation.</p><iframe title="RestoreCart mobile layout"></iframe><script type="module">const slug=new URLSearchParams(location.search).get('shop')||'';const frame=document.querySelector('iframe');const buyer=()=>{frame.src='/s/'+encodeURIComponent(slug)};document.querySelector('#shop').onclick=buyer;document.querySelector('#seller').onclick=()=>{frame.src='/restorecart'};buyer();</script></body></html>
